name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version
        run: |
          printf '# Stamped by the release workflow. "dev" triggers a git-describe fallback at runtime.\n__version__ = "%s"\n' "${{ github.ref_name }}" > modules/_version.py

      - name: Create source archive
        run: |
          zip -r HoneyBatchr-${{ github.ref_name }}.zip \
            module.py \
            main.py \
            requirements.txt \
            modules/ \
            resources/ \
            --exclude "*/__pycache__/*" \
            --exclude "*/*.pyc" \
            --exclude "*/*.pyo"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: HoneyBatchr-${{ github.ref_name }}.zip
          generate_release_notes: true
