name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller build_scripts/HoneyBatchr.spec --clean --noconfirm

      - name: Zip release artifact
        run: Compress-Archive -Path dist\HoneyBatchr\* -DestinationPath HoneyBatchr-${{ github.ref_name }}-windows.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: HoneyBatchr-${{ github.ref_name }}-windows.zip
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            flatpak flatpak-builder

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller build_scripts/HoneyBatchr.spec --clean --noconfirm

      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime and SDK
        run: flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak
        run: |
          flatpak-builder --user --install --force-clean \
            flatpak-build build_scripts/com.honeybatchr.HoneyBatchr.yml

      - name: Bundle Flatpak
        run: |
          flatpak build-bundle \
            ~/.local/share/flatpak/repo \
            HoneyBatchr-${{ github.ref_name }}-linux.flatpak \
            com.honeybatchr.HoneyBatchr

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: HoneyBatchr-${{ github.ref_name }}-linux.flatpak
          generate_release_notes: false
