app-id: com.honeybatchr.HoneyBatchr
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: honeybatchr
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --socket=cups

modules:
  - name: HoneyBatchr
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/honeybatchr
      - cp -r src/. /app/lib/honeybatchr/
      - pip3 install --no-index --find-links=wheels/ --target /app/lib/honeybatchr/ -r /app/lib/honeybatchr/requirements.txt
      - install -Dm755 honeybatchr.sh /app/bin/honeybatchr
      - install -Dm644 src/resources/badger_256.png /app/share/icons/hicolor/256x256/apps/com.honeybatchr.HoneyBatchr.png
      - install -Dm644 src/resources/badger_128.png /app/share/icons/hicolor/128x128/apps/com.honeybatchr.HoneyBatchr.png
      - install -Dm644 src/resources/badger_64.png  /app/share/icons/hicolor/64x64/apps/com.honeybatchr.HoneyBatchr.png
      - install -Dm644 src/resources/badger_48.png  /app/share/icons/hicolor/48x48/apps/com.honeybatchr.HoneyBatchr.png
      - install -Dm644 src/resources/badger_32.png  /app/share/icons/hicolor/32x32/apps/com.honeybatchr.HoneyBatchr.png
      - install -Dm644 com.honeybatchr.HoneyBatchr.desktop /app/share/applications/com.honeybatchr.HoneyBatchr.desktop
    sources:
      - type: dir
        path: ../linux/flatpak/src
        dest: src
      - type: dir
        path: ../linux/flatpak/wheels
        dest: wheels
      - type: script
        dest-filename: honeybatchr.sh
        commands:
          - export PYTHONPATH=/app/lib/honeybatchr
          - exec python3 /app/lib/honeybatchr/main.py "$@"
      - type: file
        path: com.honeybatchr.HoneyBatchr.desktop
